name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  BIN_NAME: ccmanager

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds (use cargo directly)
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            use_cross: false
          - os: macos-15
            target: x86_64-apple-darwin
            platform: darwin-amd64
            use_cross: false
          # Linux builds (use cross with musl for static linking)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-amd64
            use_cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        run: |
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          # Only strip on Linux to avoid corrupting macOS code signatures
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            strip "$bin" || true
          fi
          archive="${BIN_NAME}-${{ matrix.platform }}.tar.gz"
          tar -C "$(dirname "$bin")" -czf "$archive" ${BIN_NAME}
          shasum -a 256 "$archive" > "${BIN_NAME}-${{ matrix.platform }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.platform }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        # Uses the workflow's built-in GITHUB_TOKEN (granted via the
        # `permissions: contents: write` above). No external secret
        # needed for the first release.
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.sha256

  # NOTE: a Homebrew tap update step lived here until v1.0.0. It pushed
  # the generated Formula to `NormalUhr/homebrew-ccmanager`. To re-enable:
  # (1) create the tap repo as `NormalUhr/homebrew-ccmanager`, (2) add a
  # repo secret `RELEASE_TOKEN` (fine-grained PAT with `Contents: write`
  # on the tap repo), (3) restore the `update-tap:` job. See git history
  # for the previous YAML.
