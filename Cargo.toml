[package]
name = "ccmanager"
version = "1.0.0"
edition = "2024"
description = "Fuzzy-search Claude Code conversation history from the terminal."
readme = "README.md"
license = "MIT"
repository = "https://github.com/NormalUhr/ccmanager"
homepage = "https://github.com/NormalUhr/ccmanager"
keywords = ["claude", "claude-code", "fzf", "cli", "history"]
categories = ["command-line-utilities"]

[features]
default = ["serve", "mcp"]
# Local web UI (`ccmanager serve`). Disable for a smaller binary.
serve = [
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:askama",
    "dep:rust-embed",
    "dep:mime_guess",
    "dep:urlencoding",
    "dep:webbrowser",
]
# MCP server (`ccmanager mcp`) — Claude Code queries your history.
mcp = ["dep:tokio"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
colored = "3.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
thiserror = "2.0"
toml = "0.9"
home = "0.5"
rayon = "1.10"
ratatui = "0.30"
crossterm = "0.29"
textwrap = "0.16"
pulldown-cmark = "0.13"
unicode-width = "0.2"
arboard = "3.4"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
terminal-light = "1.0"
tempfile = "3"
indicatif = "0.17"

# --- `serve` feature dependencies (gated, default-on) ---
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros", "signal", "net", "io-std", "io-util"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["trace", "compression-gzip"], optional = true }
askama = { version = "0.14", optional = true }
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
urlencoding = { version = "2", optional = true }
webbrowser = { version = "1", optional = true }
